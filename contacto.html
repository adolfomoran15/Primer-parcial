<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UFT-8">
    <meta name="author" content="Adolfo Moran de la Vega, Franco Torres">
    <meta name="description"
        content="Recetario web que te ayuda a decidir que cocinar.Cuenta con calculadora de porciones, checklist de ingredientes y distintos filtros">
    <meta name="keywords" content="recetas, cocina, sopa, sandwich, ensalada">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title> <!-- Elegir titulo-->
</head> <!-- link a CSS y Javascript  -->

<body>
    <div id="contenedor-header">
        <header id="header-principal">
            <!-- Aca va la imagen de incio-->
            <h1>Sandwich, Sopa o ensalada</h1>
            <nav id="nav-principal">
                <a href="index.html" id="link-inicio" class="link-activo">Inicio</a>
                <a href="recetas.html" id="link-recetas">Recetas</a>
                <a href="contacto.html" id="link-contacto">Contacto</a>
            </nav>
        </header>
    </div>

    <main id="contenedor-main">
        <div class="contenedor-texto">
            <h3>Contacto</h3>
            <p>
                ¿Tenés alguna sugerencia, consulta o simplemente querés contar
                como salió la receta? Escribinos!
            </p>
        </div>
        <div class="contenedor-form">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" maxlength="50" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" maxlength="50" required>

            <label for="mensaje">Mensaje:</label>
            <input type="text" id="mensaje" name="mensaje" maxlength="500" required>

            <button id="enviar" aria-label="Boton de enviar formulario">Enviar</button>
        </div>

    </main>

    <div id="contenedor-footer">
        <footer id="footer-principal">
            <!-- IMAGEN -->
            <nav id="nav-footer">
                <a href="index.html" class="link-activo">Inicio</a>
                <a href="recetas.html">Rectas</a>
                <a href="contacto.html">Contacto</a>
            </nav>
            <p id="frase-footer">La cocina no discute teorias, las prueba.</p>
        </footer>
    </div>
</body>
</html>
